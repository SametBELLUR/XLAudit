<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Denetim Raporu Üreticisi</title>
  <style>
:root {
  --fg: #1a1a1a;
  --fg-soft: #555;
  --bg: #fafafa;
  --bg-card: #fff;
  --border: #d4d4d4;
  --border-strong: #888;
  --accent: #0b62d6;
  --accent-soft: #e8f0fc;
  --error: #c0392b;
  --error-soft: #fdecea;
  --success: #1e7e34;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

header h1 {
  font-size: 1.5rem;
  margin: 0 0 8px;
}

.subtitle {
  color: var(--fg-soft);
  margin: 0 0 24px;
  font-size: 0.95rem;
}

.subtitle code { font-family: var(--mono); font-size: 0.85em; }

.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: 8px;
  padding: 40px 24px;
  text-align: center;
  background: var(--bg-card);
  transition: background 120ms ease, border-color 120ms ease;
  cursor: pointer;
}

.dropzone:hover,
.dropzone:focus,
.dropzone.dragover {
  background: var(--accent-soft);
  border-color: var(--accent);
  outline: none;
}

.dropzone-text {
  margin: 0 0 8px;
  font-size: 1rem;
}

.filepicker { cursor: pointer; }

.filepicker-link {
  color: var(--accent);
  text-decoration: underline;
}

.dropzone-hint {
  color: var(--fg-soft);
  font-size: 0.85rem;
  margin: 0;
}

.file-info {
  margin: 16px 0 0;
  padding: 8px 12px;
  background: var(--accent-soft);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 0.85rem;
  display: inline-block;
}

.actions {
  margin: 24px 0 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

button {
  font: inherit;
  padding: 8px 18px;
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
}

button:hover:not(:disabled) { filter: brightness(1.08); }

button:disabled {
  background: #bbb;
  cursor: not-allowed;
}

.status {
  margin: 0;
  color: var(--fg-soft);
  font-size: 0.9rem;
}

.error-box {
  margin: 16px 0;
  padding: 12px 16px;
  background: var(--error-soft);
  border-left: 4px solid var(--error);
  border-radius: 4px;
  font-size: 0.95rem;
}

.error-box pre {
  font-family: var(--mono);
  font-size: 0.8rem;
  white-space: pre-wrap;
  margin: 8px 0 0;
  color: var(--fg-soft);
}

.result-box {
  margin: 24px 0 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  overflow: hidden;
}

.result-actions {
  display: flex;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: #f4f4f4;
}

.result-output {
  margin: 0;
  padding: 16px;
  max-height: 70vh;
  overflow: auto;
  font-family: var(--mono);
  font-size: 0.82rem;
  line-height: 1.45;
  white-space: pre;
  background: var(--bg-card);
}

</style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Excel Denetim Raporu Üreticisi</h1>
      <p class="subtitle">
        <code>.xlsx</code> veya <code>.xlsm</code> dosyanızdan, LLM ile denetim için
        yapılandırılmış Markdown raporu üretir.
        <strong>Dosyanız tarayıcınızda işlenir, hiçbir yere gönderilmez.</strong>
      </p>
    </header>

    <section id="dropzone" class="dropzone" tabindex="0">
      <p class="dropzone-text">
        Dosyayı buraya sürükleyin veya
        <label class="filepicker">
          <input type="file" id="file-input" accept=".xlsx,.xlsm" hidden>
          <span class="filepicker-link">dosya seçin</span>
        </label>
      </p>
      <p class="dropzone-hint">Yalnızca <code>.xlsx</code> ve <code>.xlsm</code> kabul edilir.</p>
      <p id="file-info" class="file-info" hidden></p>
    </section>

    <section class="actions">
      <button id="analyze-btn" type="button" disabled>Analiz Et</button>
      <p id="status-line" class="status" aria-live="polite"></p>
    </section>

    <section id="error-box" class="error-box" hidden>
      <strong>Hata:</strong>
      <span id="error-msg"></span>
      <details>
        <summary>Teknik detay</summary>
        <pre id="error-detail"></pre>
      </details>
    </section>

    <section id="result-box" class="result-box" hidden>
      <div class="result-actions">
        <button id="copy-btn" type="button">Panoya Kopyala</button>
        <button id="download-btn" type="button">Markdown'ı İndir</button>
      </div>
      <pre id="result-output" class="result-output"></pre>
    </section>
  </main>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
          onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js';document.head.appendChild(s);"></script>
  <script>
// === js/parse.js ===
// SheetJS workbook yükleme ve sheet meta toplama.
// IIFE + global namespace (window.EA.parse) — file:// üzerinden çalışır.

window.EA = window.EA || {};
window.EA.parse = (function () {
  const READ_OPTS = {
    type: 'array',
    dense: true,
    cellFormula: true,
    cellStyles: false,
    cellHTML: false,
    cellText: false,
    cellDates: true,
    bookVBA: true,
  };

  async function readWorkbook(arrayBuffer) {
    try {
      if (typeof XLSX === 'undefined') {
        return { ok: false, error: 'SheetJS (XLSX) yüklenmedi. CDN bağlantısını kontrol edin.' };
      }
      const wb = XLSX.read(new Uint8Array(arrayBuffer), READ_OPTS);
      return { ok: true, data: wb };
    } catch (err) {
      return { ok: false, error: err && err.message ? err.message : String(err) };
    }
  }

  // Workbook'tan her sheet için temel metadata toplar.
  function collectSheetMeta(wb) {
    const sheetDefs = wb.Workbook?.Sheets ?? [];
    return wb.SheetNames.map((name, i) => {
      const ws = wb.Sheets[name];
      const ref = ws && ws['!ref'] ? ws['!ref'] : null;
      const hidden = sheetDefs[i]?.Hidden ?? 0; // 0 visible, 1 hidden, 2 very hidden
      return { index: i, name, ref, hidden };
    });
  }

  function hiddenLabel(hidden) {
    if (hidden === 1) return 'gizli';
    if (hidden === 2) return 'çok gizli';
    return null;
  }

  // Sparse (default) ve dense modu birlikte destekler.
  function getCell(ws, r, c, addr) {
    if (ws['!data']) return ws['!data'][r]?.[c];
    return ws[addr];
  }

  // Workbook seviyesindeki named range tanımlarını çıkarır.
  function collectNamedRanges(wb) {
    const names = wb.Workbook?.Names ?? [];
    const sheetNames = wb.SheetNames ?? [];
    return names.map((n) => ({
      name: n.Name,
      ref: n.Ref ?? '',
      scope: typeof n.Sheet === 'number' ? sheetNames[n.Sheet] : null,
      comment: n.Comment ?? '',
    }));
  }

  // Bir worksheet'in tüm formül hücrelerini toplar.
  // Dönüş: [{ addr, row(1-idx), col(0-idx), colLetter, f, v, t }]
  function collectFormulas(ws) {
    if (!ws || !ws['!ref']) return [];
    const range = XLSX.utils.decode_range(ws['!ref']);
    const out = [];
    for (let r = range.s.r; r <= range.e.r; r++) {
      for (let c = range.s.c; c <= range.e.c; c++) {
        const addr = XLSX.utils.encode_cell({ r, c });
        const cell = getCell(ws, r, c, addr);
        if (!cell || !cell.f) continue;
        out.push({
          addr,
          row: r + 1,
          col: c,
          colLetter: XLSX.utils.encode_col(c),
          f: cell.f,
          v: cell.v,
          t: cell.t,
        });
      }
    }
    return out;
  }

  return {
    readWorkbook,
    collectSheetMeta,
    hiddenLabel,
    collectNamedRanges,
    collectFormulas,
  };
})();


// === js/patterns.js ===
// Formül tokenizer, patternize, gruplama ve range compaction.
// IIFE + global namespace (window.EA.patterns).

window.EA = window.EA || {};
window.EA.patterns = (function () {
  const MAX_FORMULA_LEN = 8000;

  // Tek-pas tokenizer regex. Sıra önemli — STRING, EXT_REF, SHEET_REF
  // CELL'den önce eşleşmeli ki "A1" string'i veya [file]Sheet!A1 doğru ayrılsın.
  //
  // Capture grupları:
  //   1: STRING        "..."
  //   2: EXT_REF       [...]
  //   3: SHEET_REF_Q   '...'!
  //   4: SHEET_REF     Name!
  //   5: CELL whole    $?[A-Z]+$?\d+
  //   6: CELL absCol $
  //   7: CELL col letters
  //   8: CELL absRow $
  //   9: CELL row digits
  //  10: FUNC          ident öncesinde lookahead (
  //  11: NAME          bare identifier
  //  12: NUMBER        sayısal sabit
  //  13: OP            operatörler ve ayraçlar
  //  14: WS            boşluk
  const TOKEN_RE = /("(?:[^"]|"")*")|(\[[^\]]+\])|('(?:[^']|'')*'!)|([A-Za-z_][A-Za-z0-9_.]*!)|((\$?)([A-Z]+)(\$?)(\d+))|([A-Za-z_][A-Za-z0-9_.]*)(?=\s*\()|([A-Za-z_][A-Za-z0-9_.]*)|(-?\d+(?:\.\d+)?(?:[eE]-?\d+)?%?)|(<>|<=|>=|[-+*/^&=<>,;:(){}])|(\s+)/g;

  function classifyMatch(m) {
    if (m[1] !== undefined) return { type: 'STRING', text: m[1] };
    if (m[2] !== undefined) return { type: 'EXT_REF', text: m[2] };
    if (m[3] !== undefined) return { type: 'SHEET_REF', text: m[3] };
    if (m[4] !== undefined) return { type: 'SHEET_REF', text: m[4] };
    if (m[5] !== undefined) {
      return {
        type: 'CELL',
        text: m[5],
        absCol: m[6] === '$',
        col: m[7],
        absRow: m[8] === '$',
        row: m[9],
      };
    }
    if (m[10] !== undefined) return { type: 'FUNC', text: m[10] };
    if (m[11] !== undefined) return { type: 'NAME', text: m[11] };
    if (m[12] !== undefined) return { type: 'NUMBER', text: m[12] };
    if (m[13] !== undefined) return { type: 'OP', text: m[13] };
    if (m[14] !== undefined) return { type: 'WS', text: m[14] };
    return { type: 'UNK', text: m[0] };
  }

  function tokenizeFormula(src) {
    if (src == null) return [];
    let s = String(src);
    if (s.length > MAX_FORMULA_LEN) {
      return [{ type: 'RAW', text: s }];
    }
    if (s.startsWith('=')) s = s.slice(1);

    const tokens = [];
    let pos = 0;
    while (pos < s.length) {
      TOKEN_RE.lastIndex = pos;
      const m = TOKEN_RE.exec(s);
      if (!m || m.index !== pos) {
        tokens.push({ type: 'UNK', text: s[pos] });
        pos++;
        continue;
      }
      tokens.push(classifyMatch(m));
      pos = TOKEN_RE.lastIndex;
    }
    return tokens;
  }

  function colLettersToNum(letters) {
    let n = 0;
    for (let i = 0; i < letters.length; i++) {
      n = n * 26 + (letters.charCodeAt(i) - 64);
    }
    return n;
  }

  // CELL token'ı, kendi anchor (formülün bulunduğu hücre) referansı ile
  // patern parçasına çevirir. Sütun harfi her zaman literal kalır.
  function formatCellPattern(cell, anchor) {
    const colPart = (cell.absCol ? '$' : '') + cell.col;
    let rowPart;
    if (cell.absRow) {
      rowPart = '$' + cell.row;
    } else {
      const rowNum = parseInt(cell.row, 10);
      const offset = rowNum - anchor.row;
      if (offset === 0) rowPart = '{row}';
      else if (offset > 0) rowPart = `{row+${offset}}`;
      else rowPart = `{row${offset}}`;
    }
    return colPart + rowPart;
  }

  function patternize(tokens, anchor) {
    if (tokens.length === 1 && tokens[0].type === 'RAW') {
      return {
        pattern: '<UZUN FORMÜL>',
        numericConstants: [],
        sheetRefs: [],
        extRefs: [],
        hasRelativeRow: false,
      };
    }
    const parts = ['='];
    const numericConstants = [];
    const sheetRefs = [];
    const extRefs = [];
    let hasRelativeRow = false;

    for (const t of tokens) {
      switch (t.type) {
        case 'CELL':
          if (!t.absRow) hasRelativeRow = true;
          parts.push(formatCellPattern(t, anchor));
          break;
        case 'NUMBER':
          numericConstants.push(t.text);
          parts.push(t.text);
          break;
        case 'SHEET_REF':
          sheetRefs.push(t.text);
          parts.push(t.text);
          break;
        case 'EXT_REF':
          extRefs.push(t.text);
          parts.push(t.text);
          break;
        default:
          parts.push(t.text);
      }
    }

    return {
      pattern: parts.join(''),
      numericConstants,
      sheetRefs,
      extRefs,
      hasRelativeRow,
    };
  }

  function groupByPattern(formulas) {
    const groups = new Map();
    for (const f of formulas) {
      const tokens = tokenizeFormula(f.f);
      const info = patternize(tokens, { row: f.row, col: f.col });
      let g = groups.get(info.pattern);
      if (!g) {
        g = {
          pattern: info.pattern,
          cells: [],
          numericConstants: new Set(),
          sheetRefs: new Set(),
          extRefs: new Set(),
          hasRelativeRow: info.hasRelativeRow,
          sample: f,
        };
        groups.set(info.pattern, g);
      }
      g.cells.push(f);
      info.numericConstants.forEach((n) => g.numericConstants.add(n));
      info.sheetRefs.forEach((s) => g.sheetRefs.add(s));
      info.extRefs.forEach((e) => g.extRefs.add(e));
    }
    for (const g of groups.values()) {
      g.numericConstants = [...g.numericConstants];
      g.sheetRefs = [...g.sheetRefs];
      g.extRefs = [...g.extRefs];
    }
    return groups;
  }

  // Aynı sütundaki ardışık satırları aralık olarak sıkıştırır.
  function compactRanges(cells) {
    if (cells.length === 0) return [];
    const sorted = [...cells].sort((a, b) => a.col - b.col || a.row - b.row);
    const runs = [];
    let cur = {
      col: sorted[0].col,
      colLetter: sorted[0].colLetter,
      startRow: sorted[0].row,
      endRow: sorted[0].row,
    };
    for (let i = 1; i < sorted.length; i++) {
      const c = sorted[i];
      if (c.col === cur.col && c.row === cur.endRow + 1) {
        cur.endRow = c.row;
      } else {
        runs.push(cur);
        cur = { col: c.col, colLetter: c.colLetter, startRow: c.row, endRow: c.row };
      }
    }
    runs.push(cur);
    return runs.map((r) =>
      r.startRow === r.endRow
        ? `${r.colLetter}${r.startRow}`
        : `${r.colLetter}${r.startRow}:${r.colLetter}${r.endRow}`
    );
  }

  return {
    tokenizeFormula,
    patternize,
    groupByPattern,
    compactRanges,
    __test__: { TOKEN_RE, colLettersToNum, formatCellPattern },
  };
})();


// === js/analysis.js ===
// Sheet ve workbook seviyesinde tutarsızlık, sabit ve çapraz referans
// analizi. Patern gruplarından beslenir; ham formülleri yeniden
// tokenize etmez. IIFE + global namespace (window.EA.analysis).

window.EA = window.EA || {};
window.EA.analysis = (function () {
  const MAJORITY_THRESHOLD = 0.8;

  function buildCellToPattern(groups) {
    const m = new Map();
    for (const g of groups.values()) {
      for (const cell of g.cells) m.set(cell.addr, g.pattern);
    }
    return m;
  }

  function findInconsistencies(formulas, groups) {
    const c2p = buildCellToPattern(groups);
    const byCol = new Map();
    for (const f of formulas) {
      if (!byCol.has(f.col)) byCol.set(f.col, []);
      byCol.get(f.col).push(f);
    }

    const results = [];
    for (const [col, cells] of byCol) {
      const counts = new Map();
      for (const cell of cells) {
        const p = c2p.get(cell.addr);
        if (!counts.has(p)) counts.set(p, []);
        counts.get(p).push(cell);
      }
      const sorted = [...counts.entries()].sort((a, b) => b[1].length - a[1].length);
      const total = cells.length;

      let state, majority = null, outliers = [];
      if (sorted.length === 1) {
        state = 'tutarlı';
        majority = { pattern: sorted[0][0], cells: sorted[0][1] };
      } else if (sorted[0][1].length / total >= MAJORITY_THRESHOLD) {
        state = 'sapma';
        majority = { pattern: sorted[0][0], cells: sorted[0][1] };
        outliers = sorted.slice(1).map(([p, cs]) => ({ pattern: p, cells: cs }));
      } else {
        state = 'karışık';
        outliers = sorted.map(([p, cs]) => ({ pattern: p, cells: cs }));
      }

      results.push({
        col,
        colLetter: cells[0].colLetter,
        total,
        patternCount: sorted.length,
        state,
        majority,
        outliers,
      });
    }
    return results.sort((a, b) => a.col - b.col);
  }

  function aggregateConstants(groups) {
    const map = new Map();
    for (const g of groups.values()) {
      for (const c of g.numericConstants) {
        let entry = map.get(c);
        if (!entry) {
          entry = { value: c, cellCount: 0, patterns: new Set() };
          map.set(c, entry);
        }
        entry.cellCount += g.cells.length;
        entry.patterns.add(g.pattern);
      }
    }
    return [...map.values()]
      .map((e) => ({
        value: e.value,
        cellCount: e.cellCount,
        patternCount: e.patterns.size,
        samplePatterns: [...e.patterns].slice(0, 3),
      }))
      .sort((a, b) => b.cellCount - a.cellCount);
  }

  function aggregateExternalLinks(sheets) {
    const map = new Map();
    for (const s of sheets) {
      const groups = s.patternGroups;
      if (!groups) continue;
      for (const g of groups.values()) {
        for (const ext of g.extRefs) {
          let entry = map.get(ext);
          if (!entry) {
            entry = { target: ext, cellCount: 0, patterns: new Set(), sheets: new Set() };
            map.set(ext, entry);
          }
          entry.cellCount += g.cells.length;
          entry.patterns.add(g.pattern);
          entry.sheets.add(s.name);
        }
      }
    }
    return [...map.values()]
      .map((e) => ({
        target: e.target.replace(/^\[/, '').replace(/\]$/, ''),
        cellCount: e.cellCount,
        patternCount: e.patterns.size,
        samplePatterns: [...e.patterns].slice(0, 3),
        sheets: [...e.sheets],
      }))
      .sort((a, b) => b.cellCount - a.cellCount);
  }

  function aggregateCrossSheetRefs(groups) {
    const map = new Map();
    for (const g of groups.values()) {
      for (const ref of g.sheetRefs) {
        let entry = map.get(ref);
        if (!entry) {
          entry = { ref, cellCount: 0, patterns: new Set() };
          map.set(ref, entry);
        }
        entry.cellCount += g.cells.length;
        entry.patterns.add(g.pattern);
      }
    }
    return [...map.values()]
      .map((e) => ({
        targetSheet: e.ref.replace(/!$/, ''),
        cellCount: e.cellCount,
        patternCount: e.patterns.size,
        samplePatterns: [...e.patterns].slice(0, 3),
      }))
      .sort((a, b) => b.cellCount - a.cellCount);
  }

  function findOneOffFormulas(groups, inconsistencyOutlierAddrs) {
    const out = [];
    for (const g of groups.values()) {
      if (g.cells.length !== 1) continue;
      const cell = g.cells[0];
      if (inconsistencyOutlierAddrs.has(cell.addr)) continue;
      out.push({ addr: cell.addr, pattern: g.pattern, value: cell.v });
    }
    return out.sort((a, b) => a.addr.localeCompare(b.addr));
  }

  function collectInconsistencyOutlierAddrs(inconsistencies) {
    const set = new Set();
    for (const inc of inconsistencies) {
      if (inc.state === 'tutarlı') continue;
      for (const o of inc.outliers) for (const cell of o.cells) set.add(cell.addr);
    }
    return set;
  }

  return {
    MAJORITY_THRESHOLD,
    findInconsistencies,
    aggregateConstants,
    aggregateExternalLinks,
    aggregateCrossSheetRefs,
    findOneOffFormulas,
    collectInconsistencyOutlierAddrs,
  };
})();


// === js/markdown.js ===
// Markdown rapor montajı. IIFE + global namespace (window.EA.markdown).

window.EA = window.EA || {};
window.EA.markdown = (function () {
  const { hiddenLabel } = window.EA.parse;
  const { compactRanges } = window.EA.patterns;

  const NL = '\n';

  function fmtBytes(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / 1024 / 1024).toFixed(2)} MB`;
  }

  function escapeCell(s) {
    if (s == null) return '';
    return String(s).replace(/\|/g, '\\|').replace(/\n/g, ' ').replace(/\r/g, '');
  }

  function escapeInlineCode(s) {
    return escapeCell(s).replace(/`/g, '\\`');
  }

  function fmtValue(v) {
    if (v == null) return '';
    if (typeof v === 'number') {
      if (!isFinite(v)) return String(v);
      return Number.isInteger(v) ? String(v) : v.toFixed(4).replace(/\.?0+$/, '');
    }
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    return String(v);
  }

  function joinTrimmed(arr, max = 80) {
    const s = arr.join(', ');
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }

  function renderHeader({ fileName, fileSize, fileType }) {
    return [
      `# Excel Denetim Raporu: ${fileName}`,
      '',
      `**Üretim tarihi:** ${new Date().toISOString()}  `,
      `**Dosya tipi:** ${fileType}  `,
      `**Dosya boyutu:** ${fmtBytes(fileSize)}`,
      '',
    ].join(NL);
  }

  function renderSummary(sheets, totals, namedRanges, externalLinks) {
    const visibleCount = sheets.filter((s) => s.hidden === 0).length;
    const hiddenCount = sheets.length - visibleCount;
    return [
      '## Genel Özet',
      '',
      `- Toplam sheet: ${sheets.length} (gizli: ${hiddenCount})`,
      `- Toplam formül: ${totals.formulas}`,
      `- Benzersiz formül paterni: ${totals.patterns}`,
      `- Tutarsız sütun: ${totals.inconsistentCols} (sapma: ${totals.deviationCols}, karışık: ${totals.mixedCols})`,
      `- Hardcoded sayısal sabit (benzersiz): ${totals.constants}`,
      `- Çapraz sayfa referansı (benzersiz hedef): ${totals.crossSheetTargets}`,
      `- Named range: ${namedRanges?.length ?? 0}`,
      `- External link (benzersiz dosya): ${externalLinks?.length ?? 0}`,
      '',
    ].join(NL);
  }

  function renderSheetListing(sheets) {
    const lines = [
      '## Sheet Listesi',
      '',
      '| # | Ad | Aralık | Görünürlük | Formül | Patern | Sapma |',
      '|---|----|--------|------------|--------|--------|-------|',
    ];
    sheets.forEach((s, i) => {
      const label = hiddenLabel(s.hidden);
      const vis = label ? `**${label.toUpperCase()}**` : 'görünür';
      const range = s.ref ?? '_(boş)_';
      const safeName = escapeCell(s.name);
      const fc = s.formulas ? s.formulas.length : 0;
      const pc = s.patternGroups ? s.patternGroups.size : 0;
      const dev = s.inconsistencies
        ? s.inconsistencies.filter((c) => c.state !== 'tutarlı').length
        : 0;
      lines.push(`| ${i + 1} | ${safeName} | \`${range}\` | ${vis} | ${fc} | ${pc} | ${dev} |`);
    });
    lines.push('');
    return lines.join(NL);
  }

  function renderPatternTable(sheet) {
    const groups = sheet.patternGroups;
    if (!groups || groups.size === 0) return '';
    const sorted = [...groups.values()].sort((a, b) => b.cells.length - a.cells.length);
    const lines = [
      `### Formül Desenleri (${groups.size} benzersiz, ${sheet.formulas.length} formül)`,
      '',
      '| Aralık | Patern | Adet | Örnek Değer | Sabit Değerler |',
      '|--------|--------|------|-------------|----------------|',
    ];
    for (const g of sorted) {
      const ranges = compactRanges(g.cells);
      const rangeStr = joinTrimmed(ranges, 60);
      const sampleVal = escapeCell(fmtValue(g.sample.v));
      const consts = g.numericConstants.length ? '`' + g.numericConstants.join('`, `') + '`' : '';
      const patternEsc = escapeInlineCode(g.pattern);
      lines.push(`| \`${rangeStr}\` | \`${patternEsc}\` | ${g.cells.length} | ${sampleVal} | ${consts} |`);
    }
    lines.push('');
    return lines.join(NL);
  }

  function renderInconsistencies(sheet) {
    const incs = sheet.inconsistencies ?? [];
    const flagged = incs.filter((c) => c.state !== 'tutarlı');
    if (flagged.length === 0) return '';

    const lines = ['### Tutarsızlıklar', ''];
    for (const inc of flagged) {
      const head = `**Sütun ${inc.colLetter}** — ${inc.total} formül, ${inc.patternCount} patern, durum: \`${inc.state}\``;
      lines.push(`- ${head}`);
      if (inc.state === 'sapma') {
        const m = inc.majority;
        const mRanges = joinTrimmed(compactRanges(m.cells), 80);
        lines.push(`  - Çoğunluk (${m.cells.length}): \`${escapeInlineCode(m.pattern)}\` — \`${mRanges}\``);
        for (const o of inc.outliers) {
          const oAddrs = joinTrimmed(o.cells.map((c) => c.addr), 100);
          lines.push(`  - Sapma (${o.cells.length}): \`${escapeInlineCode(o.pattern)}\` — \`${oAddrs}\``);
        }
      } else {
        for (const o of inc.outliers) {
          const oRanges = joinTrimmed(compactRanges(o.cells), 80);
          lines.push(`  - ${o.cells.length}× \`${escapeInlineCode(o.pattern)}\` — \`${oRanges}\``);
        }
      }
    }
    lines.push('');
    return lines.join(NL);
  }

  function renderConstantsTable(sheet) {
    const consts = sheet.constants ?? [];
    if (consts.length === 0) return '';
    const lines = [
      '### Sabit Değerler',
      '',
      '| Değer | Hücre Adedi | Patern Sayısı | Örnek Patern |',
      '|-------|-------------|---------------|---------------|',
    ];
    for (const c of consts) {
      const sample = c.samplePatterns[0] ? '`' + escapeInlineCode(c.samplePatterns[0]) + '`' : '';
      lines.push(`| \`${escapeCell(c.value)}\` | ${c.cellCount} | ${c.patternCount} | ${sample} |`);
    }
    lines.push('');
    return lines.join(NL);
  }

  function renderCrossSheetRefs(sheet) {
    const refs = sheet.crossSheetRefs ?? [];
    if (refs.length === 0) return '';
    const lines = [
      '### Çapraz Sayfa Referansları',
      '',
      '| Hedef | Hücre Adedi | Patern Sayısı | Örnek Patern |',
      '|-------|-------------|---------------|---------------|',
    ];
    for (const r of refs) {
      const sample = r.samplePatterns[0] ? '`' + escapeInlineCode(r.samplePatterns[0]) + '`' : '';
      lines.push(`| \`${escapeCell(r.targetSheet)}\` | ${r.cellCount} | ${r.patternCount} | ${sample} |`);
    }
    lines.push('');
    return lines.join(NL);
  }

  function renderOneOffs(sheet) {
    const oneOffs = sheet.oneOffs ?? [];
    if (oneOffs.length === 0) return '';
    const lines = [
      `### Tek Seferlik Formüller (${oneOffs.length})`,
      '',
      '| Hücre | Patern | Değer |',
      '|-------|--------|-------|',
    ];
    for (const o of oneOffs) {
      lines.push(`| ${o.addr} | \`${escapeInlineCode(o.pattern)}\` | ${escapeCell(fmtValue(o.value))} |`);
    }
    lines.push('');
    return lines.join(NL);
  }

  function renderSheetSection(sheet) {
    const label = hiddenLabel(sheet.hidden);
    const visTag = label ? ` *(${label.toUpperCase()})*` : '';
    const lines = [
      `## Sheet: ${escapeCell(sheet.name)}${visTag}`,
      '',
      `**Kullanılan aralık:** \`${sheet.ref ?? '(boş)'}\``,
      '',
    ];

    const formulas = sheet.formulas ?? [];
    if (!formulas.length) {
      lines.push('_Bu sheet\'te formül bulunamadı._', '');
      return lines.join(NL);
    }

    lines.push(renderPatternTable(sheet));
    const incBlock = renderInconsistencies(sheet);
    if (incBlock) lines.push(incBlock);
    const constBlock = renderConstantsTable(sheet);
    if (constBlock) lines.push(constBlock);
    const crossBlock = renderCrossSheetRefs(sheet);
    if (crossBlock) lines.push(crossBlock);
    const oneOffBlock = renderOneOffs(sheet);
    if (oneOffBlock) lines.push(oneOffBlock);

    return lines.join(NL);
  }

  function renderNamedRanges(namedRanges) {
    if (!namedRanges || namedRanges.length === 0) {
      return ['## Named Ranges', '', '_Named range tanımı bulunamadı._', ''].join(NL);
    }
    const lines = [
      '## Named Ranges',
      '',
      '| İsim | Referans | Kapsam | Yorum |',
      '|------|----------|--------|-------|',
    ];
    for (const n of namedRanges) {
      const scope = n.scope ? `Sheet: ${escapeCell(n.scope)}` : 'Çalışma kitabı geneli';
      const ref = n.ref ? '`' + escapeCell(n.ref) + '`' : '';
      lines.push(`| ${escapeCell(n.name)} | ${ref} | ${scope} | ${escapeCell(n.comment)} |`);
    }
    lines.push('');
    return lines.join(NL);
  }

  function renderExternalLinks(externalLinks) {
    if (!externalLinks || externalLinks.length === 0) {
      return ['## External Links', '', '_External link bulunamadı._', ''].join(NL);
    }
    const lines = [
      '## External Links',
      '',
      '| Hedef | Hücre Adedi | Patern Sayısı | Görüldüğü Sheet\'ler | Örnek Patern |',
      '|-------|-------------|---------------|---------------------|---------------|',
    ];
    for (const e of externalLinks) {
      const sample = e.samplePatterns[0] ? '`' + escapeInlineCode(e.samplePatterns[0]) + '`' : '';
      const sheetList = joinTrimmed(e.sheets, 60);
      lines.push(
        `| \`${escapeCell(e.target)}\` | ${e.cellCount} | ${e.patternCount} | ${escapeCell(sheetList)} | ${sample} |`
      );
    }
    lines.push('');
    return lines.join(NL);
  }

  function renderHiddenItems(sheets) {
    const hidden = sheets.filter((s) => s.hidden !== 0);
    if (hidden.length === 0) {
      return ['## Gizli Öğeler', '', '_Gizli sheet bulunamadı._', ''].join(NL);
    }
    const lines = [
      '## Gizli Öğeler',
      '',
      '| Sheet | Görünürlük | Aralık | Formül |',
      '|-------|------------|--------|--------|',
    ];
    for (const s of hidden) {
      const label = hiddenLabel(s.hidden);
      const fc = s.formulas?.length ?? 0;
      lines.push(
        `| ${escapeCell(s.name)} | **${label.toUpperCase()}** | \`${s.ref ?? '(boş)'}\` | ${fc} |`
      );
    }
    lines.push('');
    return lines.join(NL);
  }

  function renderVbaPlaceholder() {
    return [
      '## VBA Makroları',
      '',
      '_(Bu sürümde VBA çıkarma henüz aktif değil — M6\'da gelecek.)_',
      '',
    ].join(NL);
  }

  function computeTotals(sheets) {
    let formulas = 0, patterns = 0, deviationCols = 0, mixedCols = 0;
    const allConstants = new Set();
    const allCrossSheets = new Set();
    for (const s of sheets) {
      formulas += s.formulas?.length ?? 0;
      patterns += s.patternGroups?.size ?? 0;
      for (const c of s.constants ?? []) allConstants.add(c.value);
      for (const r of s.crossSheetRefs ?? []) allCrossSheets.add(r.targetSheet);
      for (const inc of s.inconsistencies ?? []) {
        if (inc.state === 'sapma') deviationCols++;
        else if (inc.state === 'karışık') mixedCols++;
      }
    }
    return {
      formulas,
      patterns,
      deviationCols,
      mixedCols,
      inconsistentCols: deviationCols + mixedCols,
      constants: allConstants.size,
      crossSheetTargets: allCrossSheets.size,
    };
  }

  function buildReport({ fileMeta, sheets, namedRanges, externalLinks }) {
    const totals = computeTotals(sheets);
    const parts = [
      renderHeader(fileMeta),
      renderSummary(sheets, totals, namedRanges, externalLinks),
      renderSheetListing(sheets),
      '---',
      '',
      ...sheets.map(renderSheetSection),
      '---',
      '',
      renderNamedRanges(namedRanges),
      renderExternalLinks(externalLinks),
      renderHiddenItems(sheets),
      renderVbaPlaceholder(),
    ];
    return parts.filter((p) => p !== '').join(NL);
  }

  return { buildReport };
})();


// === js/main.js ===
// Giriş noktası: DOM olayları + analiz pipeline orkestrasyonu.
// IIFE — global namespace'e ihtiyacı yok, sadece DOM'a bağlanıyor.

(function () {
  const { readWorkbook, collectSheetMeta, collectFormulas, collectNamedRanges } = window.EA.parse;
  const { groupByPattern } = window.EA.patterns;
  const {
    findInconsistencies,
    aggregateConstants,
    aggregateCrossSheetRefs,
    aggregateExternalLinks,
    findOneOffFormulas,
    collectInconsistencyOutlierAddrs,
  } = window.EA.analysis;
  const { buildReport } = window.EA.markdown;

  const yieldToUI = () => new Promise((r) => setTimeout(r, 0));

  const ACCEPTED_EXTS = ['.xlsx', '.xlsm'];
  const LARGE_FILE_THRESHOLD = 50 * 1024 * 1024; // 50 MB

  const els = {
    dropzone: document.getElementById('dropzone'),
    fileInput: document.getElementById('file-input'),
    fileInfo: document.getElementById('file-info'),
    analyzeBtn: document.getElementById('analyze-btn'),
    status: document.getElementById('status-line'),
    errorBox: document.getElementById('error-box'),
    errorMsg: document.getElementById('error-msg'),
    errorDetail: document.getElementById('error-detail'),
    resultBox: document.getElementById('result-box'),
    resultOutput: document.getElementById('result-output'),
    copyBtn: document.getElementById('copy-btn'),
    downloadBtn: document.getElementById('download-btn'),
  };

  let currentFile = null;
  let currentMarkdown = '';

  function setStatus(msg) {
    els.status.textContent = msg ?? '';
  }

  function showError(msg, detail) {
    els.errorBox.hidden = false;
    els.errorMsg.textContent = msg;
    els.errorDetail.textContent = detail ?? '';
    console.error('[ExcelAudit]', msg, detail);
  }

  function clearError() {
    els.errorBox.hidden = true;
    els.errorMsg.textContent = '';
    els.errorDetail.textContent = '';
  }

  function isAcceptedFile(file) {
    if (!file) return false;
    const name = file.name.toLowerCase();
    return ACCEPTED_EXTS.some((ext) => name.endsWith(ext));
  }

  function fileType(file) {
    const lower = file.name.toLowerCase();
    if (lower.endsWith('.xlsm')) return '.xlsm';
    if (lower.endsWith('.xlsx')) return '.xlsx';
    return 'bilinmiyor';
  }

  function setCurrentFile(file) {
    if (!isAcceptedFile(file)) {
      showError(
        'Bu dosya tipi desteklenmiyor.',
        `Beklenen: ${ACCEPTED_EXTS.join(', ')}\nVerilen: ${file?.name ?? '(yok)'}`
      );
      currentFile = null;
      els.fileInfo.hidden = true;
      els.analyzeBtn.disabled = true;
      return;
    }
    clearError();
    currentFile = file;
    els.fileInfo.hidden = false;
    els.fileInfo.textContent = `${file.name} — ${(file.size / 1024).toFixed(1)} KB`;
    els.analyzeBtn.disabled = false;
    setStatus('Hazır. "Analiz Et" butonuna basın.');
    if (file.size > LARGE_FILE_THRESHOLD) {
      setStatus(
        `Dosya büyük (${(file.size / 1024 / 1024).toFixed(1)} MB). Analiz birkaç saniye sürebilir.`
      );
    }
  }

  async function runAnalysis() {
    if (!currentFile) return;
    clearError();
    els.resultBox.hidden = true;
    els.analyzeBtn.disabled = true;
    setStatus('Dosya okunuyor…');

    try {
      const buf = await currentFile.arrayBuffer();
      setStatus('Workbook ayrıştırılıyor…');
      const wbResult = await readWorkbook(buf);
      if (!wbResult.ok) {
        showError('Workbook ayrıştırılamadı.', wbResult.error);
        return;
      }
      const wb = wbResult.data;

      setStatus(`Sheet metadata toplanıyor (${wb.SheetNames.length} sheet)…`);
      const sheets = collectSheetMeta(wb);

      for (let i = 0; i < sheets.length; i++) {
        const s = sheets[i];
        setStatus(`Sheet ${i + 1}/${sheets.length} analiz ediliyor: "${s.name}"…`);
        await yieldToUI();
        const ws = wb.Sheets[s.name];
        s.formulas = collectFormulas(ws);
        s.patternGroups = groupByPattern(s.formulas);
        s.inconsistencies = findInconsistencies(s.formulas, s.patternGroups);
        s.constants = aggregateConstants(s.patternGroups);
        s.crossSheetRefs = aggregateCrossSheetRefs(s.patternGroups);
        const outlierAddrs = collectInconsistencyOutlierAddrs(s.inconsistencies);
        s.oneOffs = findOneOffFormulas(s.patternGroups, outlierAddrs);
        console.log(
          `[ExcelAudit] ${s.name}: ${s.formulas.length} formül, ${s.patternGroups.size} patern, ${s.inconsistencies.filter((c) => c.state !== 'tutarlı').length} tutarsız sütun`
        );
      }

      setStatus('Workbook seviyesinde meta toplanıyor…');
      await yieldToUI();
      const namedRanges = collectNamedRanges(wb);
      const externalLinks = aggregateExternalLinks(sheets);

      setStatus('Markdown raporu oluşturuluyor…');
      await yieldToUI();
      const md = buildReport({
        fileMeta: {
          fileName: currentFile.name,
          fileSize: currentFile.size,
          fileType: fileType(currentFile),
        },
        sheets,
        namedRanges,
        externalLinks,
      });

      currentMarkdown = md;
      els.resultOutput.textContent = md;
      els.resultBox.hidden = false;
      setStatus(`Tamamlandı. ${sheets.length} sheet işlendi.`);
    } catch (err) {
      showError('Beklenmeyen hata oluştu.', err?.stack ?? String(err));
    } finally {
      els.analyzeBtn.disabled = !currentFile;
    }
  }

  function bindDropzone() {
    const dz = els.dropzone;

    ['dragenter', 'dragover'].forEach((ev) =>
      dz.addEventListener(ev, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dz.classList.add('dragover');
      })
    );

    ['dragleave', 'drop'].forEach((ev) =>
      dz.addEventListener(ev, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dz.classList.remove('dragover');
      })
    );

    dz.addEventListener('drop', (e) => {
      const file = e.dataTransfer?.files?.[0];
      if (file) setCurrentFile(file);
    });

    dz.addEventListener('click', (e) => {
      if (e.target.closest('label')) return;
      els.fileInput.click();
    });

    dz.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        els.fileInput.click();
      }
    });
  }

  function bindButtons() {
    els.fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) setCurrentFile(file);
    });

    els.analyzeBtn.addEventListener('click', runAnalysis);

    els.copyBtn.addEventListener('click', async () => {
      if (!currentMarkdown) return;
      try {
        await navigator.clipboard.writeText(currentMarkdown);
        const old = els.copyBtn.textContent;
        els.copyBtn.textContent = 'Kopyalandı';
        setTimeout(() => (els.copyBtn.textContent = old), 1500);
      } catch (err) {
        showError('Panoya kopyalama başarısız.', String(err));
      }
    });

    els.downloadBtn.addEventListener('click', () => {
      if (!currentMarkdown || !currentFile) return;
      const baseName = currentFile.name.replace(/\.(xlsx|xlsm)$/i, '');
      const fname = `${baseName}-denetim.md`;
      const blob = new Blob([currentMarkdown], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  }

  function init() {
    bindDropzone();
    bindButtons();
    setStatus('Bir Excel dosyası yükleyin.');
    console.log('[ExcelAudit] Hazır.');
  }

  init();
})();

  </script>
